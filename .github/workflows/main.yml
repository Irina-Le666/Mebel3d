name: Сборка APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Распаковать проект
        run: unzip -q mebel3d-project.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Тесты ядра
        working-directory: mebel3d
        run: |
          mkdir -p /tmp/out
          javac -encoding UTF-8 -d /tmp/out $(find core/src -name '*.java')
          for t in CoreTest ProjectTest BuildingTest EditorTest ControllerTest FixtureTest MaterialsTest ConstructorTest PhotoTest BlockTest; do java -ea -cp /tmp/out mebel3d.core.$t; done
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Сборка APK
        working-directory: mebel3d
        run: gradle :app:assembleDebug --stacktrace
      - name: Подготовить файл
        run: cp mebel3d/app/build/outputs/apk/debug/app-debug.apk mebel3d.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Сборка ${{ github.run_number }}
          files: mebel3d.apk
